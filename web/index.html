<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OcoMon · Perguntas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>OcoMon <span>perguntas sobre tickets</span></h1>
    <button id="new-chat" type="button">Nova conversa</button>
  </header>
  <main id="chat" aria-live="polite">
    <div class="hint" id="hint">
      Pergunte em linguagem natural. Exemplos:
      <ul>
        <li><button type="button" class="example">Me fale sobre o ticket 4830</button></li>
        <li><button type="button" class="example">Quantos tickets abertos temos por área?</button></li>
        <li><button type="button" class="example">Quais tickets estão com o SLA vencido?</button></li>
      </ul>
    </div>
  </main>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Digite sua pergunta… (Enter envia, Shift+Enter quebra linha)" required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
  <script type="module" src="app.js"></script>
</body>
</html>
